[project]
name = "bizcompass-kh"
version = "0.1.0"
description = "AI-Powered Business Registration & Startup Guide for Cambodia"
readme = "README.md"
authors = [
    { name = "Nhaaa4", email = "panhasovan51@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.5.6",
    "langchain-ollama>=1.1.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "trafilatura>=2.2.0",
]

[project.scripts]
bizcompass-kh = "bizcompass_kh:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ["notebooks"]
